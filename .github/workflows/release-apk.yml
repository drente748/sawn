name: Build and publish Android update

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Restore signing key
        env:
          SAWN_KEYSTORE_BASE64: ${{ secrets.SAWN_KEYSTORE_BASE64 }}
          SAWN_STORE_PASSWORD: ${{ secrets.SAWN_STORE_PASSWORD }}
          SAWN_KEY_ALIAS: ${{ secrets.SAWN_KEY_ALIAS }}
          SAWN_KEY_PASSWORD: ${{ secrets.SAWN_KEY_PASSWORD }}
        run: |
          if [ -n "$SAWN_KEYSTORE_BASE64" ]; then
            echo "$SAWN_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/sawn-release.keystore"
            {
              echo "SAWN_STORE_FILE=$RUNNER_TEMP/sawn-release.keystore"
              echo "SAWN_STORE_PASSWORD=$SAWN_STORE_PASSWORD"
              echo "SAWN_KEY_ALIAS=$SAWN_KEY_ALIAS"
              echo "SAWN_KEY_PASSWORD=$SAWN_KEY_PASSWORD"
            } >> local.properties
            unset SAWN_KEYSTORE_BASE64 SAWN_STORE_PASSWORD SAWN_KEY_ALIAS SAWN_KEY_PASSWORD
          else
            echo "Signing secrets are required for a secure update that keeps the existing app identity." >&2
            exit 1
          fi

      - name: Build release APK
        env:
          SAWN_UPDATE_MANIFEST_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/updates/manifest.json
        run: ./gradlew --no-daemon --max-workers=2 :app:assembleRelease

      - name: Verify signing certificate
        run: |
          actual=$($ANDROID_HOME/build-tools/36.0.0/apksigner verify --print-certs app/build/outputs/apk/release/app-release.apk | awk -F': ' '/Signer #1 certificate SHA-256 digest/ { print tolower($2) }')
          if [ -z "$actual" ] || [ "$actual" != "${SAWN_EXPECTED_CERT_SHA256,,}" ]; then
            echo "Release APK signing certificate does not match the expected update key." >&2
            exit 1
          fi
        env:
          SAWN_EXPECTED_CERT_SHA256: ${{ secrets.SAWN_SIGNING_CERT_SHA256 }}

      - name: Prepare public update manifest
        id: manifest
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, re, subprocess
          apk = pathlib.Path("app/build/outputs/apk/release/app-release.apk")
          aapt = pathlib.Path(os.environ["ANDROID_HOME"]) / "build-tools" / "36.0.0" / "aapt"
          data = subprocess.check_output([str(aapt), "dump", "badging", str(apk)], text=True)
          version_code = int(re.search(r"versionCode='(\d+)'", data).group(1))
          version_name = re.search(r"versionName='([^']+)'", data).group(1)
          tag = os.environ.get("GITHUB_REF_NAME") or f"build-{os.environ['GITHUB_RUN_NUMBER']}"
          digest = hashlib.sha256(apk.read_bytes()).hexdigest()
          manifest = {
              "versionCode": version_code,
              "versionName": version_name,
              "apkUrl": f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/download/{tag}/app-release.apk",
              "sha256": digest,
              "changelog": f"Sawn {version_name}: fixes and improvements.",
              "mandatory": False,
          }
          pathlib.Path("manifest.json").write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print(f"tag={tag}", file=open(os.environ["GITHUB_OUTPUT"], "a"))
          PY

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.manifest.outputs.tag }}
          name: Sawn ${{ steps.manifest.outputs.tag }}
          generate_release_notes: true
          files: |
            app/build/outputs/apk/release/app-release.apk
            manifest.json

      - name: Prepare GitHub Pages branch
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_API_URL: ${{ github.api_url }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error
          api = os.environ["GH_API_URL"]
          repo = os.environ["GH_REPOSITORY"]
          headers = {"Authorization": f"Bearer {os.environ['GH_TOKEN']}", "Accept": "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28"}
          def get(url):
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request) as response:
                  return json.load(response)
          try:
              get(f"{api}/repos/{repo}/git/ref/heads/gh-pages")
              print("gh-pages branch is ready")
          except urllib.error.HTTPError as error:
              if error.code != 404:
                  raise
              default_branch = get(f"{api}/repos/{repo}")["default_branch"]
              head = get(f"{api}/repos/{repo}/git/ref/heads/{default_branch}")["object"]["sha"]
              payload = json.dumps({"ref": "refs/heads/gh-pages", "sha": head}).encode()
              request = urllib.request.Request(f"{api}/repos/{repo}/git/refs", data=payload, headers=headers, method="POST")
              with urllib.request.urlopen(request) as response:
                  print(f"Created gh-pages branch: {response.status}")
          PY

      - name: Update GitHub Pages manifest
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_API_URL: ${{ github.api_url }}
        run: |
          python3 - <<'PY'
          import base64, json, os, urllib.request, urllib.error
          repository = os.environ["GH_REPOSITORY"]
          url = f"{os.environ['GH_API_URL']}/repos/{repository}/contents/updates/manifest.json"
          headers = {"Authorization": f"Bearer {os.environ['GH_TOKEN']}", "Accept": "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28"}
          data = open("manifest.json", "rb").read()
          request = urllib.request.Request(url, headers=headers)
          try:
              with urllib.request.urlopen(request) as response:
                  sha = json.load(response)["sha"]
          except urllib.error.HTTPError as error:
              if error.code != 404:
                  raise
              sha = None
          payload = {"message": "Publish Sawn update manifest", "content": base64.b64encode(data).decode(), "branch": "gh-pages"}
          if sha:
              payload["sha"] = sha
          request = urllib.request.Request(url, data=json.dumps(payload).encode(), headers=headers, method="PUT")
          with urllib.request.urlopen(request) as response:
              print(f"GitHub Pages manifest published: {response.status}")
          PY
